name: App do ponto (Android)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Montar o projeto Android
        working-directory: app-ponto
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node scripts/ajustar.js
          npx cap sync android
      - name: Gerar o APK
        working-directory: app-ponto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
      - name: Publicar para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-ponto/android/app/build/outputs/apk/debug/app-debug.apk gestti-ponto.apk
          gh release delete ponto-teste -y --cleanup-tag || true
          gh release create ponto-teste gestti-ponto.apk --prerelease --target "$GITHUB_SHA" \
            --title "Gestti Ponto (teste) · build $GITHUB_RUN_NUMBER" \
            --notes "APK de teste do app do ponto. Baixe o arquivo gestti-ponto.apk no celular Android e instale (permita instalar de fontes desconhecidas). Para atualizar, desinstale a versão anterior antes."
